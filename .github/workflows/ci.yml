---
# RISC OS CI build through build.riscos.online
#
# To reuse this configuration with your own repository:
#
#   - Create a .robuild.yaml to describe what should be built on RISC OS.
#       - `jobs.build.script` should be a list of commands to run on RISC OS
#       - `jobs.build.artifacts.path` should be the directory to zip.
#   - Create a VersionNum file if you wish to use the automated versioning
#     in the same style as the RISC OS sources. [optional]
#   - Update the 3rd step ('give the archive a versioned name') to give a
#     suitable name for the archive.
#   - Update the 4th step ('upload-artifacts') to include the same names.
#
# The 'release' job is triggered when a tag starting with a 'v' is created,
# which will create a GitHub release for the repository with the name of the
# version tag. The release will be a draft, and should be updated with
# changes as you see fit.
#

name: RISC OS

# Controls when the action will run. Triggers the workflow on:
#   * push on any branch.
#   * tag creation for tags beginning with a 'v'
#   * pull requests
on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ["*"]

env:
  COMPONENT_NAME: "oras"

jobs:
  build-riscos:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: riscos-build-server
    outputs:
      version: ${{ steps.version.outputs.version }}
      leafname: ${{ steps.package.outputs.leafname }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Obtain prerequisite build tool
        run: |
          # Fetch the build client
          curl -s -L -o riscos-build-online https://github.com/gerph/robuild-client/releases/download/v0.07/riscos-build-online && chmod +x riscos-build-online

      - name: Build PRM-in-XML documentation for the RISC OS archive
        uses: gerph/riscos-prminxml-action@v1
        with:
          files: prminxml/oras.xml,f80
          output: documentation
          pdf-generator: prince
          style: prm

      - name: Build through build.riscos.online
        run: |
          # Zip up the source to send to robuild
          zip -q9r /tmp/source-archive.zip * .robuild.yaml

          # Send the archive file to build service (timeout of 60 seconds)
          ./riscos-build-online -i /tmp/source-archive.zip -a off -t 60 -o /tmp/built

      - name: Derive version
        id: version
        run: &derive_version |
          if [ -f VersionNum ] ; then
              version=$(sed -n 's/^#define Module_FullVersion[[:space:]]*"\([^"]*\)"/\1/p' VersionNum)
          else
              version=$(git rev-parse --short HEAD)
          fi
          echo "This is version: $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Give the output a versioned name
        id: package
        run: |
          version="${{ steps.version.outputs.version }}"
          leafname="$COMPONENT_NAME-$version.zip"
          if [ -f /tmp/built,a91 ] ; then
              cp /tmp/built,a91 "$leafname"
          else
              echo "No archive was built?"
              exit 1
          fi
          echo "leafname=$leafname" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: RISCOS-build
          path: ${{ steps.package.outputs.leafname }}
        # The artifact that is downloadable from the Actions is actually a zip of the artifacts
        # that we supply. So it will be a regular Zip file containing a RISC OS Zip file.

  build-linux:
    runs-on: ubuntu-latest
    outputs:
      leafname: ${{ steps.package.outputs.leafname }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive version
        id: version
        run: *derive_version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libcjson-dev

      - name: Build the POSIX command-line tool
        run: make -C crosscompile

      - name: Run library self-tests
        run: make -C crosscompile test

      - name: Package the Linux build
        id: package
        run: |
          version="${{ steps.version.outputs.version }}"
          leafname="$COMPONENT_NAME-$version-linux-x86_64.zip"
          outdir="$PWD"
          stagedir="$(mktemp -d)"
          stage="$stagedir/$COMPONENT_NAME-$version-linux-x86_64"
          mkdir -p "$stage"
          cp crosscompile/oras "$stage/"
          cat > "$stage/README.txt" <<EOF
          oras $version - Linux x86_64 build

          Runtime dependencies (install via your distribution's package
          manager if not already present):
            - libcurl4 (or libcurl4t64 on newer Debian/Ubuntu)
            - libcjson1
          EOF
          cd "$stagedir" && zip -q9r "$outdir/$leafname" "$COMPONENT_NAME-$version-linux-x86_64"
          echo "leafname=$leafname" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: Linux-build
          path: ${{ steps.package.outputs.leafname }}

  build-docs:
    runs-on: ubuntu-latest
    outputs:
      leafname: ${{ steps.package.outputs.leafname }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive version
        id: version
        run: *derive_version

      - name: Build PRM-in-XML documentation
        uses: gerph/riscos-prminxml-action@v1
        with:
          files: prminxml/oras.xml,f80
          output: documentation
          pdf-generator: prince
          style: prm

      - name: Give the documentation a versioned name
        id: package
        run: |
          version="${{ steps.version.outputs.version }}"
          leafname="$COMPONENT_NAME-$version-documentation.zip"
          cd documentation && zip -q9r "../$leafname" .
          echo "leafname=$leafname" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: Documentation
          path: ${{ steps.package.outputs.leafname }}

  # The release only triggers when the thing that was pushed was a tag starting with 'v'
  release:
    needs: [build-riscos, build-docs, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download built RISC OS binary
        uses: actions/download-artifact@v8
        with:
          name: RISCOS-build
          path: release

      - name: Download documentation
        uses: actions/download-artifact@v8
        with:
          name: Documentation
          path: release

      - name: Download Linux build
        uses: actions/download-artifact@v8
        with:
          name: Linux-build
          path: release

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          prerelease: false
          draft: true
          artifacts: "release/${{ needs.build-riscos.outputs.leafname }},release/${{ needs.build-docs.outputs.leafname }},release/${{ needs.build-linux.outputs.leafname }}"
          artifactContentType: application/zip
